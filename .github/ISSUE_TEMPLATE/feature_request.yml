name: Feature Request
description: Submit a new feature request.
title: "[Feature Request]: "
type: Feature

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or need this feature would address.
      placeholder: Explain what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true

version: 2

updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:00"
    cooldown:
      default-days: 3

    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"

      github-actions:
        patterns:
          - "*"
  # Maintain dependencies for the JavaScript package
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:00"
    cooldown:
      default-days: 3

    groups:
      vscode-dependencies:
        patterns:
          - "@types/vscode"
          - "@vscode/*"

      react-dependencies:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      jest-dependencies:
        patterns:
          - "jest"
          - "@types/jest"

      npm-dependencies:
        patterns:
          - "*"

    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "react"
        update-types:
        - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
        - version-update:semver-major
      - dependency-name: "jest"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/jest"
        update-types:
        - version-update:semver-major
      - dependency-name: "nock"
        update-types:
        - version-update:semver-major

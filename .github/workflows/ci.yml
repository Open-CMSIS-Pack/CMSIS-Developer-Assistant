name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
  release:
    types: [published]

  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vsce_target: linux-x64
          - os: ubuntu-24.04-arm
            vsce_target: linux-arm64
          - os: windows-2025
            vsce_target: win32-x64
          - os: windows-11-arm
            vsce_target: win32-arm64
          - os: macos-15
            vsce_target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      packages: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Configure git settings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      # A release builds the tag's version on any owner, so that a fork's release carries
      # it in the VSIX names and in the version the server reports; pushes and pull requests
      # of a fork keep package.json's version.
      - name: Update current version
        if: matrix.vsce_target == 'linux-x64' && (github.repository_owner == 'Open-CMSIS-Pack' || github.event_name == 'release')
        run: |
          DESCRIBE=$(git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "${DESCRIBE}" ]; then
            DESCRIBE=$(git describe --tags --long --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          fi
          echo "DESCRIBE: ${DESCRIBE}"
          if [ -z "${DESCRIBE}" ]; then
            BASE_VERSION=$(jq -r '.version' package.json)
            if ! printf '%s\n' "${BASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "No semver tag found and package.json version is not a valid base version: ${BASE_VERSION}"
              exit 1
            fi
            BRANCH_QUALIFIER="0-g${GITHUB_SHA:0:7}"
            echo "No semver tag found; using package.json version ${BASE_VERSION} as the base."
          else
            BASE_TAG=$(printf '%s\n' "${DESCRIBE}" | grep -Eo '^v?[0-9]+\.[0-9]+\.[0-9]+' || true)
            if [ -z "${BASE_TAG}" ]; then
              echo "Failed to parse base version tag from DESCRIBE=${DESCRIBE}"
              exit 1
            fi
            BASE_VERSION="${BASE_TAG#v}"
            BRANCH_QUALIFIER=$(printf '%s\n' "${DESCRIBE}" | grep -Eo '[0-9]+\-g[0-9a-f]+$' || true)
          fi
          # For non-release builds, increment the patch version by 1 (e.g. 1.64.1 -> 1.64.2)
          NEXT_VERSION="$(printf '%s\n' "${BASE_VERSION}" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')"
          SAFE_REF_NAME="${{ github.ref_name }}"
          SAFE_REF_NAME="${SAFE_REF_NAME//[^0-9A-Za-z-]/-}"

          case ${{ github.event_name }} in
            release)
              TAG="${{ github.event.release.tag_name }}"
              npm version --allow-same-version --no-git-tag-version --new-version "${TAG#v}"
              ;;
            pull_request)
              npm version -s --allow-same-version --no-git-tag-version --new-version "${NEXT_VERSION}"
              PR_VERSION="${NEXT_VERSION}-${BRANCH_QUALIFIER}"
              npm version --allow-same-version --no-git-tag-version --new-version "${PR_VERSION}"
              echo "Prerelease version set succeeded"
              ;;
            *)
              npm version -s --allow-same-version --no-git-tag-version --new-version "${NEXT_VERSION}"
              PR_VERSION="${NEXT_VERSION}-${SAFE_REF_NAME}${BRANCH_QUALIFIER}"
              npm version --allow-same-version --no-git-tag-version --new-version "${PR_VERSION}"
              echo "Prerelease version set succeeded"
              ;;
          esac
          VERSION="$(jq -r ".version" < package.json)"
          sed -i "s/## Unreleased/## ${VERSION}/" CHANGELOG.md
          echo "Updated version to ${VERSION}"

      - name: Remove badges
        if: matrix.vsce_target == 'linux-x64'
        run: |
          sed -i "/https:\/\/qlty\.sh\/gh/d" README.md
          sed -i "/https:\/\/securityscorecards\.dev\/viewer/d" README.md
          sed -i "/https:\/\/img.shields.io\//d" README.md

      - name: Upload dist
        if: matrix.vsce_target == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            ./README.md
            ./package.json
            ./CHANGELOG.md
          retention-days: 1

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      # Tests read procedure contracts from the git-ignored core knowledge index.
      # Restore the pinned index on every test runner, then verify or fetch it.
      - name: Read the pinned index hash
        id: knowledge-lock
        run: node -e "const fs = require('node:fs'); const lock = require('./resources/knowledge/core.lock.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha256=' + lock.sha256 + '\n');"

      - name: Restore the core knowledge index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/knowledge/core.db
          key: knowledge-core-${{ steps.knowledge-lock.outputs.sha256 }}

      - name: Fetch the core knowledge index
        run: npm run knowledge:fetch

      - name: Lint
        if: matrix.vsce_target == 'linux-x64'
        run: npm run lint

      - name: Compile TypeScript
        if: matrix.vsce_target == 'linux-x64'
        run: npm run compile

      - name: Build code
        run: npm run build

      # - name: Check copyright
      #   if: matrix.vsce_target == 'linux-x64'
      #   run: npm run copyright:check

      - name: Run tests
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run --auto-servernum npm run test
          else
            npm run test
          fi

      - name: Run transport tests
        run: npm run test:transport

      # Skipped for PRs from forks and from dependabot: neither gets the
      # QLTY_COVERAGE_TOKEN secret, and the action fails rather than skips
      # without it.
      - name: Publish coverage report to QLTY
        if: >
          github.repository_owner == 'Open-CMSIS-Pack' &&
          matrix.vsce_target == 'linux-x64' &&
          (
            github.event_name != 'pull_request' ||
            (
              github.event.pull_request.user.login != 'dependabot[bot]' &&
              github.event.pull_request.head.repo.full_name == github.repository
            )
          )
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info
          skip-errors: false

  package:
    needs: build-and-test
    strategy:
      fail-fast: true
      matrix:
        target:
          - win32-x64
          - win32-arm64
          - linux-x64
          - linux-arm64
          - darwin-arm64
    runs-on: ubuntu-24.04
    permissions:
      packages: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Configure git settings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version-file: package.json
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .

      - name: Install dependencies
        run: npm ci

      # The core knowledge index is git-ignored and pinned by resources/knowledge/core.lock.json;
      # packaging refuses a VSIX without it. Cached by the pinned hash, fetched on a miss.
      - name: Read the pinned index hash
        id: knowledge-lock
        run: echo "sha256=$(jq -r .sha256 resources/knowledge/core.lock.json)" >> "$GITHUB_OUTPUT"

      - name: Restore the core knowledge index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/knowledge/core.db
          key: knowledge-core-${{ steps.knowledge-lock.outputs.sha256 }}

      - name: Fetch the core knowledge index
        run: npm run knowledge:fetch

      - name: Package VSIX
        run: npm run package -- --target ${{ matrix.target }}

      - name: Upload VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./*${{ matrix.target }}*.vsix
          archive: false
          retention-days: 1

  publish:
    name: Publish release
    runs-on: [ubuntu-24.04]
    if: github.event_name == 'release'
    needs: [ package ]
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cmsis-developer-assistant-*.vsix

      - name: Attach packages
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            **/*.vsix
